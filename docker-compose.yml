version: '3.8'
services:
  db:
    image: postgres:17-alpine
    container_name: kwatapos_db
    environment:
      POSTGRES_USER: kwata_admin
      POSTGRES_PASSWORD: kwata_password
      POSTGRES_DB: kwatapos
    # Host 5432 is Homebrew Postgres (user akamaotto: databases poblysh + kwatapos).
    # This container is optional; do not publish 5432.
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
