[package]
name = "backend"
version = "0.1.0"
edition = "2024"
[lib]
path = "src/lib.rs"

[[bin]]
name = "backend"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde = "1.0"
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", features = ["json"] }
tower = { version = "0.5.3", features = ["util"] }
